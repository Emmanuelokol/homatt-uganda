<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Homatt Clinic</title>
  <link href="fonts/inter.css?v=1" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <link href="fonts/material-icons.css?v=1" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1B5E20">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Homatt Clinic">
  <link rel="apple-touch-icon" href="icons/clinic-192.png?v=2">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/clinic-512.png?v=2">
  <link rel="stylesheet" href="css/clinic.css?v=20260627">
</head>
<body>
<div class="admin-login-page">
  <div class="admin-login-card">
    <div class="admin-login-logo">
      <div class="admin-login-logo-mark">
        <span class="material-icons-outlined" style="font-size:28px">local_hospital</span>
      </div>
      <div class="admin-login-title">Clinic Portal</div>
      <div class="admin-login-sub">Homatt Health — Uganda</div>
    </div>

    <form id="loginForm">
      <div class="login-field">
        <label for="email">Staff Email</label>
        <input type="text" id="email" name="clinic-login-id" placeholder="doctor@yourclinic.ug" required
               inputmode="email" autocomplete="off" autocapitalize="none"
               autocorrect="off" spellcheck="false" aria-autocomplete="none">
      </div>
      <div class="login-field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required
               autocomplete="current-password" autocapitalize="none"
               autocorrect="off" spellcheck="false">
      </div>
      <button type="submit" class="login-btn" id="loginBtn">
        Sign In to Clinic Portal
      </button>
    </form>

    <div class="login-divider">or</div>

    <button class="demo-btn" id="demoBtn">
      <span class="material-icons-outlined" style="font-size:16px;vertical-align:middle;margin-right:6px">play_circle</span>
      Open Demo Dashboard
    </button>

    <a id="apkDownload" href="https://github.com/Emmanuelokol/homatt-uganda/releases/download/android-latest/HomattHealth.apk"
       style="display:none;align-items:center;justify-content:center;gap:6px;margin-top:12px;padding:12px;border:none;border-radius:10px;background:#1B5E20;color:#fff;font-size:13.5px;font-weight:700;text-decoration:none">
      <span class="material-icons-outlined" style="font-size:18px">android</span>
      Get the Android app (best offline — installs from a file)
    </a>
    <div id="apkHint" style="display:none;font-size:11px;color:#9AA0A6;text-align:center;margin-top:6px;line-height:1.5">
      Opens fully offline on any phone. After downloading, tap the file and allow install.
    </div>

    <div class="login-error" id="loginError"></div>
    <div id="buildMarker" style="text-align:center;margin-top:14px;font-size:10px;color:#B0BEC5;letter-spacing:.3px"></div>
  </div>
</div>
<script>
  // Visible build marker — so we can confirm which version a device is running
  // (and whether it's the native app or the browser). Bump BUILD on each change.
  (function () {
    var BUILD = 'v44';
    try {
      var native = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
      var standalone = window.matchMedia('(display-mode: standalone)').matches;
      var mode = native ? 'app' : (standalone ? 'installed' : 'browser');
      var el = document.getElementById('buildMarker');
      if (el) el.textContent = 'Homatt Clinic • build ' + BUILD + ' • ' + mode;
    } catch (e) {}
  })();
</script>

<script src="js/vendor/supabase.min.js?v=2110"></script>
<script src="../js/config.js"></script>
<script src="js/clinic-offline.js?v=12"></script>
<script src="js/pwa-install.js?v=20260705g"></script>
<script>
  (function() {
    try {
      const s = JSON.parse(localStorage.getItem('clinic_session') || 'null');
      if (s && typeof s === 'object' && !Array.isArray(s)) {
        window.location.href = 'dashboard.html';
        return;
      }
    } catch(e) {}
    localStorage.removeItem('clinic_session');
  })();

  // Offer the native Android app (best offline) on Android web browsers only —
  // not inside an already-installed app, and not on desktop.
  (function() {
    try {
      var isAndroid = /Android/i.test(navigator.userAgent || '');
      var inApp = window.matchMedia('(display-mode: standalone)').matches ||
                  !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
      if (isAndroid && !inApp) {
        var a = document.getElementById('apkDownload');
        var h = document.getElementById('apkHint');
        if (a) a.style.display = 'flex';
        if (h) h.style.display = 'block';
      }
    } catch(e) {}
  })();

  const cfg = window.HOMATT_CONFIG || {};
  const _supa = (cfg.SUPABASE_URL && window.supabase)
    ? window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, {
        auth: { storageKey: 'sb-homatt-clinic-auth' }
      }) : null;

  // IMPORTANT: never rewrite the field's value while the user is typing.
  // Samsung/Gboard keyboards hold the current word in an IME composition
  // buffer; changing input.value mid-composition makes the keyboard re-commit
  // its whole buffer, which DUPLICATES the text (emmanuel@emmanuel@…).
  // So we only sanitize when it's safe: after composition ends, on blur,
  // and right before submitting.
  const emailInput = document.getElementById('email');
  let _composing = false;

  function sanitizeEmail() {
    if (_composing) return; // never touch the value mid-composition
    const cleaned = emailInput.value.replace(/[^a-zA-Z0-9._%+@\-]/g, '');
    if (cleaned !== emailInput.value) emailInput.value = cleaned;
  }

  emailInput.addEventListener('compositionstart', () => { _composing = true; });
  emailInput.addEventListener('compositionend',   () => { _composing = false; sanitizeEmail(); });
  emailInput.addEventListener('blur', sanitizeEmail);

  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    _composing = false;
    sanitizeEmail();
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('loginError');
    err.style.display = 'none';

    if (!_supa) {
      localStorage.setItem('clinic_session', JSON.stringify({ email, staffName: email.split('@')[0], clinicName: 'Clinic Portal' }));
      window.location.href = 'dashboard.html';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Signing in…';

    const { data: authData, error: authError } = await _supa.auth.signInWithPassword({ email, password });
    if (authError) {
      err.textContent = authError.message;
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign In to Clinic Portal';
      return;
    }

    const { data: pu } = await _supa
      .from('portal_users')
      .select('*, clinics(name)')
      .eq('auth_user_id', authData.user.id)
      .eq('role', 'clinic_staff')
      .eq('is_active', true)
      .single();

    if (!pu) {
      await _supa.auth.signOut();
      err.textContent = 'No clinic staff account found for this email.';
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign In to Clinic Portal';
      return;
    }

    localStorage.setItem('clinic_session', JSON.stringify({
      userId: authData.user.id,
      staffName: pu.full_name || email,
      clinicId: pu.clinic_id,
      clinicName: pu.clinics?.name || 'Clinic',
      staffRole: pu.staff_role || 'owner',
      email
    }));
    window.location.href = 'dashboard.html';
  });

  document.getElementById('demoBtn').addEventListener('click', () => {
    localStorage.setItem('clinic_session', JSON.stringify({
      staffName: 'Dr. Demo',
      clinicName: 'Kampala Medical Centre',
      clinicId: null,
      demo: true
    }));
    window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
