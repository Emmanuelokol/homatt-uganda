<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Homatt Health clinic app icon — wordmark on brand green.
       Rounded here for reference; the PNGs are full-bleed so Android masks
       them. Edit the text/cross below and re-run the rasteriser to regenerate
       clinic-512.png / clinic-192.png. -->
  <rect width="512" height="512" rx="112" fill="#1B5E20"/>
  <g fill="#FFFFFF">
    <!-- Health cross -->
    <rect x="232" y="104" width="48" height="128" rx="14"/>
    <rect x="192" y="144" width="128" height="48" rx="14"/>
    <!-- Wordmark -->
    <text x="256" y="352" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="98">Homatt</text>
    <text x="256" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="40" letter-spacing="8">HEALTH</text>
  </g>
</svg>
