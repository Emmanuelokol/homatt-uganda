name: Deploy Edge Functions (branch)

# Deploys edge functions on every push to claude/* branches.
on:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'supabase/functions/**'
      # ...and when this file changes — see the note in deploy-edge-function.yml.
      - '.github/workflows/deploy-edge-functions-branch.yml'
  workflow_dispatch:              # Allow manual trigger from GitHub Actions UI

env:
  SUPABASE_PROJECT_REF: kgkdiykzmqjougwzzewi

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # CHECK THE TOKEN WORKS, NOT THAT IT IS NON-EMPTY.
      #
      # This step used to test only that the secret had some characters in it,
      # and then said "✓ SUPABASE_ACCESS_TOKEN is set" — which it was, and it
      # was also revoked. The job then ran on for three more steps and failed
      # at the ninth function with "unexpected list functions status 401", nine
      # times over, naming nothing anybody could act on.
      #
      # A revoked token and a missing one need the same remedy and must
      # therefore produce the same sentence, at the first step, not the last.
      - name: Check SUPABASE_ACCESS_TOKEN works
        run: |
          set -uo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Supabase dashboard → Account → Access Tokens → generate one, then GitHub → Settings → Secrets and variables → Actions → SUPABASE_ACCESS_TOKEN."
            exit 1
          fi
          code=$(curl -sS -o /tmp/sb_projects.json -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            https://api.supabase.com/v1/projects || echo 000)
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is set but Supabase REJECTED it (HTTP $code). It has expired or been revoked. Generate a new one at Supabase dashboard → Account → Access Tokens, then replace the SUPABASE_ACCESS_TOKEN secret at GitHub → Settings → Secrets and variables → Actions. Nothing deploys until that is done."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Could not reach the Supabase Management API (HTTP $code). Nothing has been deployed; try again shortly."
            exit 1
          fi
          if ! grep -q "$SUPABASE_PROJECT_REF" /tmp/sb_projects.json; then
            echo "::error::The token is valid but project $SUPABASE_PROJECT_REF is not one it can see. It probably belongs to a different Supabase account or organisation."
            exit 1
          fi
          echo "✓ token accepted, and it can see $SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Only the secrets that actually have a value: `supabase secrets set
      # X=""` WRITES an empty value rather than skipping it, which silently
      # erases a key somebody set by hand in the dashboard. Values are passed
      # through `env:` so a key containing a quote cannot become shell.
      - name: Set Supabase secrets
        run: |
          set -uo pipefail
          args=()
          keep() {
            if [ -n "${2:-}" ]; then
              args+=("$1=$2"); echo "  will set $1"
            else
              echo "  skipping $1 — not in GitHub Secrets, leaving the project's value alone"
            fi
          }
          keep ONESIGNAL_APP_ID          "$ONESIGNAL_APP_ID"
          keep ONESIGNAL_REST_API_KEY    "$ONESIGNAL_REST_API_KEY"
          keep SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          keep ANTHROPIC_API_KEY         "$ANTHROPIC_API_KEY"
          keep OPENAI_API_KEY            "$OPENAI_API_KEY"
          keep DEEPGRAM_API_KEY          "$DEEPGRAM_API_KEY"
          if [ ${#args[@]} -eq 0 ]; then
            echo "::warning::No secrets in GitHub — nothing set, nothing erased."
            exit 0
          fi
          # continue-on-error on this step means GitHub marks it green whatever
          # happens — which is how a revoked token produced a run with one red
          # step and three green ones that had all failed. If it fails, SAY so.
          if out=$(supabase secrets set "${args[@]}" --project-ref "$SUPABASE_PROJECT_REF" 2>&1); then
            echo "$out"
          else
            echo "$out"
            why=$(printf '%s\n' "$out" | grep -v '^[[:space:]]*$' | tail -3 | tr '\n' ' ' | cut -c1-400)
            echo "::warning::secrets were NOT set — $why"
          fi
        env:
          SUPABASE_ACCESS_TOKEN:      ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ONESIGNAL_APP_ID:           ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY:     ${{ secrets.ONESIGNAL_REST_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:             ${{ secrets.OPENAI_API_KEY }}
          DEEPGRAM_API_KEY:           ${{ secrets.DEEPGRAM_API_KEY }}
        continue-on-error: true   # Don't block deploy if secrets step has issues

      # Allow GitHub Pages (and localhost for dev) to call edge functions.
      # Without this the Supabase gateway returns 403 "Host not in allowlist"
      # before CORS headers in the function code ever run.
      - name: Configure Supabase Auth allowed origins
        run: |
          curl -s -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "site_url": "https://emmanuelokol.github.io",
              "additional_redirect_urls": "https://emmanuelokol.github.io/**\nhttp://localhost:3000/**\nhttp://localhost:5173/**"
            }' | jq '{site_url: .site_url, status: "auth config updated"}' || echo "::warning::Auth config update failed (non-fatal)"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true

      # ── Deploy EVERY function in the repo ─────────────────────────────────
      # The directory is the list. A hand-written one is how `transcribe` came
      # to be written, documented, keyed and tested without ever being
      # deployed — for a clinic whose only symptom was a dictate button saying
      # it could not reach the service.
      # THE CLI'S OWN WORDS GO IN THE ANNOTATION, NOT JUST "failed to deploy".
      #
      # This step failed on EVERY run for eleven days — all nine functions,
      # every time — and said only "<fn> failed to deploy" nine times over. The
      # reason was in the CLI's output, which was printed to the log and then
      # discarded, and a log is exactly what somebody diagnosing this from
      # outside GitHub often cannot reach: the download is served from Azure
      # blob storage, which a corporate proxy will refuse, while the run's
      # ANNOTATIONS come straight from the GitHub API and are always readable.
      #
      # So the failure now carries its own cause. An error that does not say
      # why is how a deploy stays broken for a fortnight without anybody
      # knowing which question to ask.
      - name: Deploy every Edge Function
        run: |
          set -uo pipefail
          echo "Supabase CLI: $(supabase --version 2>&1 | tr '\n' ' ')"
          echo "::notice::Supabase CLI $(supabase --version 2>&1 | head -1)"
          PUBLIC=" ai-proxy send-notification discharge-notify payment-notify relworx-payment "
          failed=""
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            [ -f "$dir/index.ts" ] || { echo "skipping $fn — no index.ts"; continue; }
            case "$PUBLIC" in
              *" $fn "*) flags="--no-verify-jwt"; note="(open)" ;;
              *)         flags="";               note="(signed-in callers only)" ;;
            esac
            echo "── deploying $fn $note"
            # shellcheck disable=SC2086
            if out=$(supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" $flags 2>&1); then
              echo "$out"
              echo "✓ $fn"
            else
              echo "$out"
              # The last few non-empty lines are where the CLI puts the reason.
              why=$(printf '%s\n' "$out" | grep -v '^[[:space:]]*$' | tail -4 | tr '\n' ' ' | cut -c1-500)
              echo "::error::$fn failed to deploy — $why"
              failed="$failed $fn"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::these did not deploy:$failed"
            exit 1
          fi
          echo "All Edge Functions deployed."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: List what is deployed
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true
