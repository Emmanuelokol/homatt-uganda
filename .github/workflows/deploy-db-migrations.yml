name: Apply DB Migrations

# Runs whenever a new migration SQL file is pushed.
# Uses the Supabase Management API to execute SQL directly —
# no DB password required, only SUPABASE_ACCESS_TOKEN.
on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

env:
  SUPABASE_PROJECT_REF: kgkdiykzmqjougwzzewi

jobs:
  migrate:
    name: Apply DB Migrations
    runs-on: ubuntu-latest
    # 81 migrations are re-applied on every push, two of them ~190 KB seed
    # files. Ten minutes was not a generous budget for that; it was a cliff.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check SUPABASE_ACCESS_TOKEN is set
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set."
            echo "::error::Go to: Supabase dashboard → Account → Access Tokens → create one"
            echo "::error::Then: GitHub repo → Settings → Secrets → Actions → New secret"
            exit 1
          fi
          echo "✓ SUPABASE_ACCESS_TOKEN is set"

      # This step said, in a comment, that it must not fail the whole job —
      # every migration here is idempotent and re-applying one that is already
      # in place is expected to be noisy. It failed the job anyway, on every
      # push since 22 August 2026, because GitHub runs `run:` under `bash -e`:
      # ONE non-zero exit from curl or jq aborts the step regardless of what
      # the `if` below decides. A transient network blip on any one of 81
      # migrations was enough, and nothing said which.
      #
      # `set +e` makes the comment true. Each call is judged by its HTTP code,
      # which is what the script was already trying to do.
      - name: Apply all migrations via Supabase API
        run: |
          set +e
          APPLIED=0; WARNED=0; FAILED_FILES=""
          for SQL_FILE in $(ls supabase/migrations/*.sql | sort); do
            echo "──────────────────────────────────────────"
            echo "Applying: $SQL_FILE"

            # --max-time so one hung request cannot eat the job's whole budget;
            # --retry for the blips that were taking the run down.
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              --max-time 180 --retry 2 --retry-delay 3 \
              "https://api.supabase.com/v1/projects/${{ env.SUPABASE_PROJECT_REF }}/database/query" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
              -H "Content-Type: application/json" \
              --data-binary "$(jq -n --rawfile q "$SQL_FILE" '{query: $q}')")
            CURL_RC=$?

            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -c 400)

            if [ "$CURL_RC" != "0" ]; then
              echo "::warning::Could not reach Supabase for $SQL_FILE (curl exit $CURL_RC)"
              WARNED=$((WARNED+1)); FAILED_FILES="$FAILED_FILES $SQL_FILE"
            elif [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
              echo "✓ $SQL_FILE applied"
              APPLIED=$((APPLIED+1))
            else
              echo "::warning::Migration $SQL_FILE returned HTTP $HTTP_CODE: $BODY"
              WARNED=$((WARNED+1)); FAILED_FILES="$FAILED_FILES $SQL_FILE"
            fi
          done

          echo "──────────────────────────────────────────"
          echo "applied cleanly: $APPLIED   with a warning: $WARNED"
          # Named, not just counted. "7 warnings" out of 81 files tells nobody
          # which migration did not go in, which is the only thing worth knowing.
          if [ -n "$FAILED_FILES" ]; then
            echo "::warning::Did not apply cleanly:$FAILED_FILES"
          fi
          echo "✓ Migration run complete"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # ── Enable pg_cron push notifications ────────────────────────────────
      # Every scheduled reminder (follow-up "come back" nudges, medication
      # reminders, symptom check-ins) runs through the DB function
      # notify_call(), which can only reach the send-notification edge function
      # if app.service_role_key is set on the database. This used to be a manual
      # one-time step in the SQL Editor; automating it here means cron-based
      # push notifications work without anyone remembering to run it.
      - name: Configure pg_cron notification key
        run: |
          if [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY not set — scheduled push reminders will be skipped."
            echo "::warning::Add it at: GitHub repo → Settings → Secrets → Actions"
            exit 0
          fi
          SQL="alter database postgres set app.service_role_key = '${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}';"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${{ env.SUPABASE_PROJECT_REF }}/database/query" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data-binary "$(jq -n --arg q "$SQL" '{query: $q}')")
          CODE=$(echo "$RESPONSE" | tail -1)
          if [ "$CODE" = "200" ] || [ "$CODE" = "201" ]; then
            echo "✓ pg_cron notification key configured — scheduled reminders can now send pushes"
          else
            echo "::warning::Could not set app.service_role_key (HTTP $CODE) — scheduled push reminders may be skipped"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
