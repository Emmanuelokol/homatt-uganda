apply plugin: 'com.android.application'

android {
    namespace "ug.homatt.health"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ug.homatt.health"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI bumps the version code every build (APK_VERSION_CODE = run number)
        // so each published APK installs as an UPDATE over the previous one —
        // preserving the clinic's offline data instead of forcing an uninstall.
        versionCode (System.getenv("APK_VERSION_CODE") ?: "2").toInteger()
        versionName (System.getenv("APK_VERSION_NAME") ?: "1.1.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        // MultiDex support for large app
        multiDexEnabled true
    }
    // Stable signing so every build (from any machine/CI runner) is signed with
    // the SAME key — the requirement for Android to accept one APK as an update
    // of another. The keystore is committed for build reproducibility; it is a
    // sideload distribution key, not a Play Store key.
    signingConfigs {
        release {
            storeFile file('../homatt-upload.keystore')
            storePassword System.getenv("HOMATT_KEYSTORE_PASSWORD") ?: "homattclinic2026"
            keyAlias "homatt"
            keyPassword System.getenv("HOMATT_KEYSTORE_PASSWORD") ?: "homattclinic2026"
        }
    }
    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            debuggable false
            // Minification off: safety over size. Proguard stripping has broken
            // Capacitor plugin bridges before, and we can't afford a build that
            // installs but misbehaves in clinics.
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/NOTICE']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // MultiDex
    implementation "androidx.multidex:multidex:2.0.1"
    // WebKit for modern WebView features
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
